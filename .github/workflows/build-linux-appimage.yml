name: build-linux-appimage

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '把构建产物发布到该 Release 标签（留空=只上传 Artifact）'
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'desktop/**'
      - 'tools/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/build-linux-appimage.yml'

permissions:
  contents: write

jobs:
  appimage:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # AppImage 打包工具需要 libfuse2（24.04 起包名为 libfuse2t64）
      - name: Install AppImage build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 || sudo apt-get install -y libfuse2t64 || true

      - name: Install npm deps
        run: npm install --no-audit --no-fund
        env:
          ELECTRON_BUILDER_CACHE: .cache/electron-builder

      - name: Build AppImage
        run: npx electron-builder --linux AppImage --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          ELECTRON_BUILDER_CACHE: .cache/electron-builder

      - name: Show built files
        run: ls -lh dist || true

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameArtLibrary-linux-AppImage
          path: dist/*.AppImage
          if-no-files-found: error

      # 手动触发并给了 release_tag 时，直接把 AppImage 挂到该 Release（公开直链，免登录）
      - name: Publish to Release
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ inputs.release_tag }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --prerelease --title "$TAG" --notes "Linux AppImage 构建（自动发布）。"
          fi
          gh release upload "$TAG" dist/*.AppImage --clobber
          echo "已发布 → https://github.com/${{ github.repository }}/releases/tag/$TAG"
